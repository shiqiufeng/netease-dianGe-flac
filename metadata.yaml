name: astrbot_plugin_netease_unblock
display_name: 网易云音乐点歌-flac
desc: 网易云音乐点歌-flac 插件：搜索网易云音乐，优先原唱（自动跳过翻唱）、按音源顺序取直链（音质由排前面的音源上游决定，默认 byfuns 即无损），直链由自部署的 UnblockNeteaseMusic-utils 音源服务提供，无版权时改发 QQ 音乐卡片，支持卡片/文件/语音/文本四种发送方式。列表 60 秒内可反复回复序号，支持 1~3 连号与 1-2-4-9-10 多选连点。
version: v2.10.0
author: "流水, 听雨的蛙, 落雪, GLM-5.3-Flash"
repo: https://github.com/shiqiufeng/netease-dianGe-flac
